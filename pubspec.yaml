name: knitters_eye
description: "A knitting pattern tracker app with row counter and Knitter's Eye perspective"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # File Handling
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  
  # PDF Support
  flutter_pdfview: ^1.3.2
  
  # Storage
  sqflite: ^2.4.1
  shared_preferences: ^2.3.3
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sample_patterns/
